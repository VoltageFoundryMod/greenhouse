<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>patch preview</title>
        <!-- Development page (not published): the patch drawer without a device.
             js/patch.js runs on a stand-in app that logs the lines it would send
             (B.node, B.wire, ...). Serve the repo and open /tools/patch-preview.html;
             ?run starts it "running", so edits show their live lines;
             ?caps=achene, ?caps=grid16x8 (or 8x8, 16x16, og16x8) acts as that
             device connected. -->
        <link rel="stylesheet" href="../style.css" />
        <link rel="stylesheet" href="../refresh.css" />
        <link rel="stylesheet" href="../vendor/drawflow.css" />
        <link rel="stylesheet" href="../patch.css" />
        <style>
            body {
                margin: 0;
                background: var(--bg-default);
                color: var(--neutral-heavy);
                font:
                    13px/1.4 system-ui,
                    sans-serif;
            }
            #log {
                margin: 8px 12px;
                height: 22vh;
                overflow: auto;
                font:
                    12px ui-monospace,
                    monospace;
                color: #9aa1a8;
            }
        </style>
    </head>
    <body>
        <section id="patchDrawer" class="patch-drawer open">
            <div class="midi-drawer-bar">
                <span class="midi-toggle">graft (preview)</span>
                <span id="patchStatus" class="midi-status"></span>
                <div class="repl-actions-spacer"></div>
                <div class="midi-controls patch-controls">
                    <button type="button" id="patchRunBtn" class="repl-action-btn">run</button>
                    <button type="button" id="patchStopBtn" class="repl-action-btn">stop</button>
                    <button type="button" id="patchFileBtn" class="repl-action-btn">show file</button>
                    <select id="patchTargetSelect" class="repl-action-btn patch-select"></select>
                    <select id="patchExampleSelect" class="repl-action-btn patch-select"></select>
                    <button type="button" id="patchScreenBtn" class="repl-action-btn">screen</button>
                    <button type="button" id="patchGuideBtn" class="repl-action-btn">? guide</button>
                </div>
            </div>
            <div id="patchBody" class="patch-body">
                <nav id="patchPalette" class="patch-palette" aria-label="blocks"></nav>
                <div id="patchCanvas" class="patch-canvas"></div>
                <div class="patch-zoom" id="patchZoom" role="group" aria-label="zoom">
                    <button type="button" data-zoom="out">−</button>
                    <button type="button" id="patchZoomLabel" data-zoom="reset">100%</button>
                    <button type="button" data-zoom="in">+</button>
                    <button type="button" data-zoom="fit">fit</button>
                </div>
            </div>
        </section>
        <pre id="log"></pre>
        <script type="module">
            import { patchMethods } from '../js/patch.js';
            import { patchScreenMethods } from '../js/patch-screen.js';
            import { patchGridMethods } from '../js/patch-grid.js';
            import { dividerMethods } from '../js/dividers.js';
            import { EXAMPLES, patchFile } from '../js/patch-blocks.js';

            const log = document.getElementById('log');
            const note = (text) => {
                log.textContent = `${text}\n${log.textContent}`.slice(0, 6000);
            };
            const $ = (id) => document.getElementById(id);
            // a device with the runtime file it was sent, and what it runs (B.build)
            const device = { running: '-', file: null };
            const app = Object.assign(
                {
                    elements: {
                        patchDrawer: $('patchDrawer'),
                        patchStatus: $('patchStatus'),
                        patchRunBtn: $('patchRunBtn'),
                        patchPalette: $('patchPalette'),
                        patchCanvas: $('patchCanvas'),
                        patchBody: $('patchBody'),
                        patchZoomLabel: $('patchZoomLabel'),
                        patchScreenBtn: $('patchScreenBtn'),
                        patchTargetSelect: $('patchTargetSelect'),
                        patchExampleSelect: $('patchExampleSelect')
                    },
                    iiiDevice: { isConnected: true },
                    uploadInProgress: false,
                    acheneSupported: true,
                    outputLine: note,
                    executeLua: async (line) => note(`> ${line}`),
                    executeLuaCapture: async (line) => {
                        if (line.includes('B.build')) return [device.running];
                        if (line.includes('fs_file_size')) return device.file ? [String(device.file.size)] : [];
                        if (line.includes('fs_run_file')) device.running = device.file?.build || '-';
                        if (line.includes('B.clear')) device.running = '-';
                        return [];
                    },
                    uploadChecked: async (name, text) => {
                        const build = /B\.build = "(\w+)"/.exec(text)?.[1];
                        if (name === 'blocks_run.lua')
                            device.file = { build, size: new TextEncoder().encode(text).length };
                        note(`(uploaded ${name}, ${text.length} bytes)`);
                        return true;
                    }
                },
                patchMethods,
                patchScreenMethods,
                patchGridMethods,
                dividerMethods
            );
            app.initPatch();
            const caps = new URLSearchParams(location.search).get('caps');
            const grid = caps && /^(og)?grid(\d+)x(\d+)$/.exec(caps.replace(/^og/, 'oggrid'));
            if (caps === 'achene') {
                app.patchCaps = { achene: true, grid: false, og: false, size: { x: 16, y: 8 }, kind: 'achene' };
            } else if (grid) {
                const size = { x: Number(grid[2]), y: Number(grid[3]) };
                const kind = `${grid[1] ? 'Open Grid' : 'grid'} ${size.x}×${size.y}`;
                app.patchCaps = { achene: false, grid: true, og: Boolean(grid[1]), size, kind };
            }
            if (caps) app.updatePatchTarget();
            app.bindPaneDividers();
            // ?hidden builds the canvas while the drawer is hidden, as the app
            // does before a device connects, then shows it
            const hidden = location.search.includes('hidden');
            if (hidden) $('patchDrawer').hidden = true;
            app.patchPanelOpen = true;
            app.showPatchDrawerState();
            await app.ensurePatchEditor();
            if (hidden) setTimeout(() => ($('patchDrawer').hidden = false), 300);
            app.updatePatchStatus();
            $('patchRunBtn').addEventListener('click', () => app.runPatch());
            $('patchZoom').addEventListener('click', (e) => {
                const how = e.target.closest('[data-zoom]')?.dataset.zoom;
                if (how) app.zoomPatch(how);
            });
            $('patchStopBtn').addEventListener('click', () => app.stopPatch());
            $('patchScreenBtn').addEventListener('click', () => app.togglePatchLayout());
            $('patchExampleSelect').addEventListener('change', (e) => {
                if (e.target.value) app.loadPatch(EXAMPLES[e.target.value]());
                e.target.value = '';
            });
            $('patchGuideBtn').addEventListener('click', () => app.togglePatchGuide());
            const showFile = async () => {
                const patch = app.exportPatch();
                note(patchFile('preview', patch, await app.patchRuntime(patch)));
            };
            $('patchFileBtn').addEventListener('click', showFile);
            window.app = app;
            // ?example=sequencer loads an example
            const example = new URLSearchParams(location.search).get('example');
            if (example) app.loadPatch(EXAMPLES[example]());
            if (location.search.includes('run')) await app.runPatch();
            if (location.search.includes('file')) await showFile();
        </script>
    </body>
</html>

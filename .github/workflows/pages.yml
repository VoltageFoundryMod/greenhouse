# Publishes greenhouse to GitHub Pages: https://greenhouse.vfmod.com
#
# tools/dist.mjs copies the site into dist/ (no build step) and gives the
# service worker a cache name per commit, so installed copies (PWA) switch to
# each release.
#
# Repository settings: Pages -> Source: GitHub Actions; custom domain
# greenhouse.vfmod.com (from CNAME) with Enforce HTTPS (Web Serial needs
# HTTPS). diii.vfmod.com, its old address, redirects there.

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build site
        run: |
          node tools/dist.mjs
          ls -R dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
